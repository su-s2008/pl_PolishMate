<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вчити слова — PolishMate</title>

    <link rel="stylesheet" href="/CSS/style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            🇵🇱 PolishMate
        </div>

        <nav class="navigation">
            <a href="/html/index.html">Головна</a>
            <a href="/html/words.html">Вчити слова</a>
            <a href="/html/index.html">Категорії</a>
            <a href="/html/favorites.html">⭐ Мої слова</a>
        </nav>

    </header>

    <main class="words-page">
        <h1>Вивчай польські слова </h1>
        <p class="words-description">
            Знайди потрібне слово або фразу.
        </p>
        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder=" Введи польське слово..."
            >
        </div>

        <div class="category-buttons">
    <button data-category="all">
        Усі
    </button>
    <button data-category="daily">
        🇵🇱 Повсякденне
    </button>
    <button data-category="doctor">
        🏥 У лікаря
    </button>
    <button data-category="work">
        💼 Робота
    </button>
</div>
        <div id="wordsList" class="words-list"></div>

    </main>
    <script src="/JavaScript/words.js"></script>
</body>

</html>
